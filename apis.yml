aid: fifthdoor
name: Fifth Door
description: Fifth Door is a San Francisco-based, Y Combinator-backed (Fall 2025)
  AI-native gaming startup founded by Amir Ghazvinian and Daniel Kan that lets anyone
  create, share, and play games simply by describing what they imagine, with no coding
  required. Its generative-AI platform turns natural-language prompts into playable,
  customizable games, aiming to collapse the time, cost, and technical complexity of
  traditional game development for players, creators, and studios. Backed by Felicis,
  the company runs a consumer web app and does not currently publish a public developer
  API or documentation.
